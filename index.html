<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nawat Learning Path</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="stat-group" id="streak-button" style="cursor: pointer;">
                <img src="SinRacha.svg" alt="Racha" class="icon-flame" id="icon-streak">
                <span class="stat-text color-orange" id="streak-count">0</span>
            </div>
            <div class="stat-group">
                <img src="Pluma-06.svg" alt="Protector" class="icon-gem">
                <span class="stat-text color-purple" id="protector-count">0</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="path-container" id="stage-view">
            <section id="stage-1" class="stage-section">
                <!-- Header Banner -->
                <div class="stage-banner">
                    <div class="stage-subtitle">ETAPA 1, SECCIÓN 1</div>
                    <div class="stage-title">Aprende a presentarte</div>
                </div>

                <!-- Path Nodes -->
                <div class="nodes-wrapper">
                    <div class="node-row offset-right-1">
                        <button class="node-btn active-node" data-node-id="1-1" onclick="window.location.href='lesson.html?stage=1&node=1'">
                            <svg class="node-icon" viewBox="0 0 24 24" fill="white">
                                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
                            </svg>
                        </button>
                    </div>

                    <div class="node-row offset-right-2">
                        <button class="node-btn locked-node" data-node-id="1-2" onclick="window.location.href='lesson.html?stage=1&node=2'">
                            <svg class="node-icon" viewBox="0 0 24 24" fill="white">
                                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
                            </svg>
                        </button>
                    </div>

                    <div class="node-row active-row">
                        <img src="Neutral.svg" alt="Character" class="character">
                        <div class="node-wrapper-active">
                            <button class="node-btn active-node locked-node" data-node-id="1-3" onclick="window.location.href='lesson.html?stage=1&node=3'">
                                <img src="Pluma-06.svg" alt="Nahuatl" class="node-icon" style="filter: brightness(0) invert(1);">
                            </button>
                        </div>
                    </div>

                    <div class="node-row offset-left-1">
                        <button class="node-btn locked-node" data-node-id="1-4" onclick="window.location.href='lesson.html?stage=1&node=4'">
                            <svg class="node-icon" viewBox="0 0 24 24" fill="white">
                                <path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43 1.43 1.43L18.43 19.86l1.43 1.43 1.43-1.43-1.43-1.43 1.43-1.43-1.43-1.43z" />
                            </svg>
                        </button>
                    </div>

                    <div class="node-row offset-left-2">
                        <button class="node-btn locked-node" data-node-id="1-5" onclick="window.location.href='lesson.html?stage=1&node=5'">
                            <svg class="node-icon" viewBox="0 0 24 24" fill="white">
                                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
                            </svg>
                        </button>
                    </div>

                    <div class="node-row offset-right-1">
                        <button class="node-btn vocab-node locked-node" data-node-id="1-6" onclick="window.location.href='lesson.html?stage=1&node=6'" title="Vocabulario">
                            <svg class="node-icon" viewBox="0 0 24 24" fill="white">
                                <path d="M18 2H8a3 3 0 0 0-3 3v14a3 3 0 0 0 3 3h10a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1zm-1 18H8a1 1 0 0 1 0-2h9v2zm0-4H8a3 3 0 0 0-1 .17V5a1 1 0 0 1 1-1h9v12z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </section>

            <section id="stage-2" class="stage-section locked">
                <!-- Header Banner -->
                <div class="stage-banner" style="background-color: var(--salmon);">
                    <div class="stage-subtitle">ETAPA 2, SECCIÓN 1</div>
                    <div class="stage-title">Los colores</div>
                </div>

                <!-- Path Nodes -->
                <div class="nodes-wrapper">
                    <div class="node-row offset-right-1">
                        <button class="node-btn active-node locked-node" data-node-id="2-1" onclick="window.location.href='lesson.html?stage=2&node=1'">
                            <svg class="node-icon" viewBox="0 0 24 24" fill="white">
                                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
                            </svg>
                        </button>
                    </div>

                    <div class="node-row offset-right-2">
                        <button class="node-btn locked-node" data-node-id="2-2" onclick="window.location.href='lesson.html?stage=2&node=2'">
                            <svg class="node-icon" viewBox="0 0 24 24" fill="white">
                                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
                            </svg>
                        </button>
                    </div>

                    <div class="node-row active-row">
                        <img src="Neutral.svg" alt="Character" class="character">
                        <div class="node-wrapper-active">
                            <button class="node-btn active-node locked-node" data-node-id="2-3" onclick="window.location.href='lesson.html?stage=2&node=3'">
                                <img src="Pluma-06.svg" alt="Nahuatl" class="node-icon" style="filter: brightness(0) invert(1);">
                            </button>
                        </div>
                    </div>

                    <div class="node-row offset-left-1">
                        <button class="node-btn locked-node" data-node-id="2-4" onclick="window.location.href='lesson.html?stage=2&node=4'">
                            <svg class="node-icon" viewBox="0 0 24 24" fill="white">
                                <path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43 1.43 1.43L18.43 19.86l1.43 1.43 1.43-1.43-1.43-1.43 1.43-1.43-1.43-1.43z" />
                            </svg>
                        </button>
                    </div>

                    <div class="node-row offset-left-2">
                        <button class="node-btn locked-node" data-node-id="2-5" onclick="window.location.href='lesson.html?stage=2&node=5'">
                            <svg class="node-icon" viewBox="0 0 24 24" fill="white">
                                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
                            </svg>
                        </button>
                    </div>

                    <div class="node-row offset-right-1">
                        <button class="node-btn vocab-node locked-node" data-node-id="2-6" onclick="window.location.href='lesson.html?stage=2&node=6'" title="Vocabulario">
                            <svg class="node-icon" viewBox="0 0 24 24" fill="white">
                                <path d="M18 2H8a3 3 0 0 0-3 3v14a3 3 0 0 0 3 3h10a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1zm-1 18H8a1 1 0 0 1 0-2h9v2zm0-4H8a3 3 0 0 0-1 .17V5a1 1 0 0 1 1-1h9v12z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <main class="dictionary-view hidden" id="dictionary-view">
            <section class="dictionary-header">
                <h1>Vocabulario</h1>
                <div class="dictionary-session-meta" id="dictionary-session-meta">Pregunta 1 de 20</div>
            </section>
            <section class="dictionary-practice-card" id="dictionary-practice-card"></section>
        </main>

        <!-- Floating Action Button (Menu) -->
        <button class="fab-btn" id="menu-btn" title="Menú de Etapas">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
            </svg>
        </button>

        <nav class="bottom-switcher" aria-label="Cambiar vista">
            <button class="switcher-btn active" id="view-stages-btn" type="button">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2 4 6v12l8 4 8-4V6l-8-4zm0 2.24L17.53 7 12 9.76 6.47 7 12 4.24zM6 8.62l5 2.5v8.26l-5-2.5V8.62zm7 10.76v-8.26l5-2.5v8.26l-5 2.5z"/>
                </svg>
                <span>Etapas</span>
            </button>
            <button class="switcher-btn" id="view-dictionary-btn" type="button">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18 2H8a3 3 0 0 0-3 3v14a3 3 0 0 0 3 3h10a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1zm-1 18H8a1 1 0 0 1 0-2h9v2zm0-4H8a3 3 0 0 0-1 .17V5a1 1 0 0 1 1-1h9v12z"/>
                </svg>
                <span>Diccionario</span>
            </button>
        </nav>
    </div>

    <!-- Stage Menu Modal -->
    <div id="stage-modal" class="modal hidden">
        <div class="modal-header">
            <button class="close-btn" id="close-stage-btn">
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                </svg>
            </button>
            <h2 class="modal-title">Seleccionar Etapa</h2>
            <div style="width: 24px;"></div>
        </div>
        <div class="modal-content" style="padding-top: 20px;">
            <div class="stage-option" data-stage="1">
                <div class="stage-option-title">Etapa 1: Aprende a presentarte</div>
            </div>
            <div class="stage-option" data-stage="2">
                <div class="stage-option-title">Etapa 2: Los colores</div>
            </div>
        </div>
    </div>

    <!-- Streak Modal -->
    <div id="streak-modal" class="modal hidden">
        <div class="modal-header">
            <button class="close-btn" id="close-modal-btn">
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                </svg>
            </button>
            <h2 class="modal-title">Días de racha</h2>
            <div style="width: 24px;"></div>
        </div>

        <div class="modal-content">
            <!-- Streak highlight card -->
            <div class="streak-card">
                <div class="streak-info">
                    <div class="badge-society" id="badge-society">SOCIEDAD DE RACHAS EXTENSAS</div>
                    <div class="streak-huge-number" id="modal-streak-count">0</div>
                    <div class="streak-label">días de racha</div>
                </div>
                <div class="streak-icon-large">
                    <img src="SinRacha.svg" alt="Flame" id="modal-flame-icon">
                </div>
            </div>

            <!-- Calendar -->
            <h3 class="calendar-title">Calendario de racha</h3>
            <div class="calendar-card">
                <div class="calendar-header">
                    <button class="cal-nav-btn" id="cal-prev">&lt;</button>
                    <div class="cal-month" id="cal-month-label">mayo de 2026</div>
                    <button class="cal-nav-btn" id="cal-next">&gt;</button>
                </div>
                <div class="calendar-grid" id="calendar-grid">
                    <!-- Day names -->
                    <div class="day-name">D</div>
                    <div class="day-name">L</div>
                    <div class="day-name">Ma</div>
                    <div class="day-name">Mi</div>
                    <div class="day-name">J</div>
                    <div class="day-name">V</div>
                    <div class="day-name">S</div>
                    <!-- Days will be generated dynamically by JS -->
                </div>
                <div class="calendar-data-actions">
                    <button class="calendar-data-btn" id="download-user-data-btn" type="button">Descargar datos</button>
                    <button class="calendar-data-btn calendar-data-btn-secondary" id="upload-user-data-btn" type="button">Subir datos</button>
                    <input id="upload-user-data-input" type="file" accept="application/json,.json" hidden>
                </div>
            </div>


        </div>
    </div>

    <script src="streak.js"></script>
    <script src="data.js"></script>
    <script src="dictionary_data.js"></script>
    <script src="app.js"></script>
</body>

</html>
